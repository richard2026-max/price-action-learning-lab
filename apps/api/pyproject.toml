[project]
name = "price-action-learning-lab-api"
version = "0.1.0"
description = "Price Action Learning Lab - local backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pillow>=10.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "typer>=0.12",
    "exchange-calendars>=4.5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pall = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120  # 中文注释/文档串较宽
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() 默认值为官方惯例

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
